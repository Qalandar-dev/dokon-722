# Single public entrypoint: /api and /media -> FastAPI, everything else -> Next.js.
# TLS is terminated here in production (see docker/nginx/README.md / main README).

upstream api_upstream      { server api:8000;      keepalive 16; }
upstream frontend_upstream { server frontend:3000; keepalive 16; }

# Login brute-force protection (FastAPI also rate-limits via Redis).
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
# General API bucket (bot traffic, admin panel, payment callbacks).
limit_req_zone $binary_remote_addr zone=api:20m rate=30r/s;

map $http_upgrade $connection_upgrade { default upgrade; '' close; }

# HSTS only when the request reached the TLS terminator over HTTPS (empty = not sent).
map $http_x_forwarded_proto $hsts {
    https   "max-age=31536000; includeSubDomains";
    default "";
}

server {
    listen 8080;
    server_name _;
    server_tokens off;

    client_max_body_size 12m;   # product image uploads (validated again by the API)

    # Nginx is the single source of these headers; drop the upstream copies.
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security $hsts always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    location = /nginx-health { access_log off; return 200 "ok\n"; }

    location /api/v1/admin/auth/ {
        limit_req zone=auth burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://api_upstream;
    }

    location /api/ {
        limit_req zone=api burst=60 nodelay;
        limit_req_status 429;
        proxy_pass http://api_upstream;
        proxy_read_timeout 60s;
    }

    location /media/ {
        alias /srv/media/;
        access_log off;
        expires 7d;
        # A location with its own add_header does not inherit the server ones: repeat them.
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header Strict-Transport-Security $hsts always;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'" always;
        # Never execute or render uploaded content as HTML.
        types { image/jpeg jpg jpeg; image/png png; image/webp webp; }
        default_type application/octet-stream;
    }

    location /_next/static/ {
        proxy_pass http://frontend_upstream;
        expires 365d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header Strict-Transport-Security $hsts always;
    }

    location / {
        proxy_pass http://frontend_upstream;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

# Production overrides:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# Only Nginx publishes a port. Terminate TLS in front of it (see README "Production deployment").

x-prod-logging: &prod-logging
  logging:
    driver: json-file
    options: { max-size: "20m", max-file: "5" }

# Application containers: read-only root filesystem, no Linux capabilities, no privilege
# escalation. Only the media volume (api) and /tmp are writable.
x-hardened: &hardened
  read_only: true
  tmpfs: ["/tmp"]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

services:
  postgres:
    <<: *prod-logging
    restart: always
  redis:
    <<: *prod-logging
    restart: always
  migrate:
    <<: *hardened
    environment:
      ENVIRONMENT: production
  api:
    <<: [*prod-logging, *hardened]
    restart: always
    command:
      - uvicorn
      - app.main:app
      - --host=0.0.0.0
      - --port=8000
      - --workers=${API_WORKERS:-2}
      - --proxy-headers
      - --forwarded-allow-ips=*
      - --no-server-header
    environment:
      ENVIRONMENT: production
  bot:
    <<: [*prod-logging, *hardened]
    restart: always
    environment:
      ENVIRONMENT: production
  worker:
    <<: [*prod-logging, *hardened]
    restart: always
    environment:
      ENVIRONMENT: production
  frontend:
    <<: [*prod-logging, *hardened]
    tmpfs: ["/tmp", "/app/.next/cache"]
    restart: always
  nginx:
    <<: *prod-logging
    restart: always
    security_opt: ["no-new-privileges:true"]
